<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="DejaVu Sans Mono, Liberation Mono, monospace">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#131c26"/>
  <rect x="70" y="60" width="1460" height="780" rx="22" fill="#1a2b3c" filter="url(#shadow)"/>

  <circle cx="118" cy="110" r="10" fill="#ff5f57"/>
  <circle cx="150" cy="110" r="10" fill="#febc2e"/>
  <circle cx="182" cy="110" r="10" fill="#28c840"/>

  <rect x="1330" y="92" width="156" height="38" rx="9" fill="#24374a"/>
  <text x="1408" y="117" font-size="19" fill="#7e93a6" text-anchor="middle">round 2 / 3</text>

  <text x="120" y="205" font-size="21" fill="#16a085">&#8250;</text>
  <text x="152" y="205" font-size="21" fill="#9bb0c2">I don't think you need three agents for this. It's a CRUD app.</text>

  <text x="120" y="282" font-size="21" fill="#e8eef3">Adversarial Gate: Partly agreed, and partly not.</text>

  <rect x="120" y="326" width="5" height="92" rx="2.5" fill="#2e7d8f"/>

  <g stroke="#28c840" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 154 364 L 164 374 L 182 352"/>
  </g>
  <text x="206" y="373" font-size="21" fill="#e8eef3">You're right about A1 &#8212; cutting it.</text>

  <g stroke="#e74c3c" stroke-width="3.6" stroke-linecap="round" fill="none">
    <path d="M 155 396 L 179 420"/>
    <path d="M 179 396 L 155 420"/>
  </g>
  <text x="206" y="416" font-size="21" fill="#e8eef3">A2 stays. Remove it and the analysis marks its own homework.</text>

  <text x="120" y="492" font-size="21" fill="#9bb0c2">Revised: 2 agents, ~18k typical / ~29k worst case.</text>

  <text x="120" y="566" font-size="21" fill="#16a085">&#8250;</text>
  <text x="152" y="566" font-size="21" fill="#9bb0c2">Fair.</text>

  <text x="120" y="643" font-size="21" fill="#e8eef3">Do you confirm this analysis?</text>

  <rect x="120" y="700" width="1360" height="58" rx="8" fill="#c0392b"/>
  <text x="152" y="737" font-size="21" font-weight="bold" fill="#ffffff">GATE &#8212; nothing proceeds without your approval</text>
</svg>
